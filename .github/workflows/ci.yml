name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

defaults:
  run:
    working-directory: examples/project-polished

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
